<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه شخصی من</title>
    <style>
        body { font-family: Tahoma, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background: #f4f4f4; }
        section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { border: 1px solid #ddd; padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

    <section id="about">
        <h1>سلام، من [نام شما] هستم</h1>
        <p>خوش آمدید! در اینجا مجموعه‌ای از پروژه‌ها و علایق من را می‌بینید.</p>
    </section>

    <section id="apps">
        <h2>اپ‌های من</h2>
        <div class="grid">
            <div class="card"><h3>اپلیکیشن اول</h3><a href="#">لینک گیت‌هاب</a></div>
            <div class="card"><h3>اپلیکیشن دوم</h3><a href="#">لینک گیت‌هاب</a></div>
        </div>
    </section>

    <section id="books">
        <h2>کتاب‌های پیشنهادی</h2>
        <ul><li>کتاب اول</li><li>کتاب دوم</li></ul>
    </section>

    <section id="albums">
        <h2>آلبوم‌های موسیقی</h2>
        <div class="grid">
            <div class="card">نام آلبوم ۱</div>
            <div class="card">نام آلبوم ۲</div>
        </div>
    </section>

    <section id="movies">
        <h2>فیلم‌های کوتاه</h2>
        <p>به زودی...</p>
    </section>

</body>
</html>
